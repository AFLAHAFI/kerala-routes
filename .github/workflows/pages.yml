name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check server URL
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://kerala-routes-server.onrender.com' }}
        run: node -e "if(!/^https:\/\/.+/.test(process.env.VITE_SERVER_URL||''))throw Error('Set repository variable VITE_SERVER_URL to the Render HTTPS URL first.')"
      - name: Build browser game
        run: npm run build:client
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://kerala-routes-server.onrender.com' }}
          VITE_BASE_PATH: ./
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

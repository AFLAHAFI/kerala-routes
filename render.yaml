services:
  - type: web
    name: kerala-routes-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: REQUIRE_PERSISTENCE
        value: "true"
      - key: CLIENT_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROFILE_TOKEN
        sync: false
